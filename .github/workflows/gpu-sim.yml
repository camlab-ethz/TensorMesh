name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so the CUDA-only
# tests in the main CI skip. This workflow runs the test suite with the CUDA build
# of PyTorch on a simulated NVIDIA H100 with PantheonSim
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tensormesh/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: tests (CUDA 13.0, simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The toolkit's nvcc is used by PyTorch's JIT-compiled reduction kernels
      # (torch.prod on CUDA tensors).
      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install OpenGL / X11 runtime libs for gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libgl1 libx11-6 libxrender1 libxcursor1 \
            libxft2 libxinerama1 libxfixes3 libfontconfig1

      - name: Install package (CUDA torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cu130
          pip install -e ".[test]"

      # --preload makes the simulator's CUDA libraries win over the ones inside
      # the PyTorch wheel. Without it torch.cuda fails to initialize.
      - name: Run test suite on the simulated GPU
        run: |
          vgpu run --preload python -m pytest tests/ -v -rs \
            --deselect tests/ode/test_implicit_linear_euler_with_bc.py::test_implicit_euler_with_bc_cuda
        # test_implicit_euler_with_bc_cuda is deselected: it compares the
        # float64 GPU solve against a manual solve with atol=rtol=1e-12 and the
        # difference is about 3e-9. A real RTX 3060 gives the same difference, so
        # the tolerance is not met on hardware either (not a simulator problem).
        # The multi-rank NCCL tests skip because the simulated machine has one GPU.
